# Quarto project for the module readings (teaching-materials/readings/).
# The website is built by MyST from myst.yml, and the session decks are PowerPoint files
# (teaching-materials/deck-prompts/); this file only affects `quarto render`.
project:
  type: default
  # Only the readings are Quarto documents. Without this list, a bare
  # `quarto render` at the repo root would try to render the lesson .md pages
  # and the learner-bundle notebooks too.
  render:
    - teaching-materials/readings/*.qmd

# Reading code is shown, never run.
execute:
  enabled: false

# Shared settings. Each reading lists `format: typst` in its header and gets these settings.
format:
  typst:
    margin:
      x: 2cm
      y: 2cm
    include-in-header:
      text: |
        #show raw.where(block: true): set text(size: 0.75em)
        #show raw.where(block: true): it => { set par(justify: false); it }
