# Conda environment for module-03_lesson-02_retrieve-noaa-nwm-data.ipynb (and its _solutions copy),
# from Reproducible Workflows with Open Water Data (CUAHSI). See the bundle README.
# Create:  conda env create -f module-03_lesson-02_retrieve-noaa-nwm-data_environment.yml
# Kernel:  conda run -n m03-nwm python -m ipykernel install --user --name m03-nwm --display-name "Python (m03-nwm)"
name: m03-nwm
channels:
  - conda-forge
dependencies:
  - python=3.14
  # discovery: NLDI / COMIDs
  - pynhd
  - geopandas
  # reading NWM NetCDF files and kerchunk / virtual-Zarr references
  - xarray
  - netcdf4
  - h5netcdf
  - h5py
  - zarr>=3
  - kerchunk
  - fsspec
  - gcsfs
  - s3fs
  - ujson
  - dask
  - pandas
  - requests
  - matplotlib
  # For running inside Jupyter
  - nest-asyncio  # only needed when running hydrotools inside Jupyter
  - ipykernel     # needed to run the notebooks in Jupyter
  - jupyterlab
  - ipywidgets
  # dependencies of hydrotools.nwm_client, installed from conda-forge where possible
  - pytables
  - pint
  - pyarrow
  - google-cloud-storage
  - beautifulsoup4
  - aiohttp
  - aiofiles
  - adlfs
  - planetary-computer
  - pip
  - pip:
      - hydrotools.nwm_client
      - nwmurl
