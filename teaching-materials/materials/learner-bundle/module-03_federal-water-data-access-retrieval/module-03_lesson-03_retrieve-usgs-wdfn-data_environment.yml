# Conda environment for module-03_lesson-03_retrieve-usgs-wdfn-data.ipynb (and its _solutions copy),
# from Federal Open Water Data for Researchers (CUAHSI). See the bundle README.
# Create:  conda env create -f module-03_lesson-03_retrieve-usgs-wdfn-data_environment.yml
# Kernel:  conda run -n m03-wdfn python -m ipykernel install --user --name m03-wdfn --display-name "Python (m03-wdfn)"
name: m03-wdfn
channels:
  - conda-forge
dependencies:
  - python=3.14
  - dataretrieval>=1.4   # modernized `waterdata` module (USGS Water Data APIs)
  - pandas
  - geopandas
  - matplotlib          # figures and maps in the lesson
  - requests            # river line for the location map (NLDI)
  # For running inside Jupyter
  - ipykernel     # needed to run the notebooks in Jupyter
  - jupyterlab
  - ipywidgets
