# Conda environment for module-03_lesson-01_retrieve-nasa-swot-data.ipynb (and its _solutions copy),
# from Federal Open Water Data for Researchers (CUAHSI). See the bundle README.
# Create:  conda env create -f module-03_lesson-01_retrieve-nasa-swot-data_environment.yml
# Kernel:  conda run -n m03-swot python -m ipykernel install --user --name m03-swot --display-name "Python (m03-swot)"
name: m03-swot
channels:
  - conda-forge
dependencies:
  - python=3.14         # 3.12+ avoids the earthaccess SSL import error noted in the notebook
  - earthaccess
  - xarray
  - netcdf4
  - h5netcdf
  - rioxarray
  - numpy               # imported directly in the lesson
  - pandas
  - geopandas
  - shapely
  - pyproj
  - requests
  - matplotlib
  # For running inside Jupyter
  - ipykernel     # needed to run the notebooks in Jupyter
  - jupyterlab
  - ipywidgets
