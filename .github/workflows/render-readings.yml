# Renders the module readings to PDF on request (never automatically).
# Actions → "Render readings" → Run workflow. Pick the branch, a reading (or "all"),
# and whether to open a draft PR that commits the PDFs.
# Session decks are PowerPoint files and need no rendering (see teaching-materials/deck-prompts/).
name: Render readings

on:
  workflow_dispatch:
    inputs:
      reading:
        description: 'Reading file name without .qmd (e.g. module-03_reading_federal-water-data-access-retrieval), or "all"'
        required: true
        default: all
      open_pr:
        description: Open a draft PR into dev with the rendered PDFs (otherwise just download the artifact)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - name: Choose readings
        run: |
          cd teaching-materials/readings
          if [ "${{ inputs.reading }}" = "all" ]; then
            ls module-*_reading_*.qmd | sed 's/\.qmd$//' > ../../readings.txt
          else
            test -f "${{ inputs.reading }}.qmd" || { echo "No reading named ${{ inputs.reading }}.qmd"; exit 1; }
            echo "${{ inputs.reading }}" > ../../readings.txt
          fi
          cat ../../readings.txt

      - name: Render readings (PDF)
        run: |
          OUT="teaching-materials/readings/rendered"
          mkdir -p "$OUT"
          # Render from the repo root so _quarto.yml applies (shared settings, and figures in images/)
          while read -r r; do
            quarto render "teaching-materials/readings/$r.qmd" --to typst
            mv "teaching-materials/readings/$r.pdf" "$OUT/"
          done < readings.txt
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-readings-${{ github.run_number }}
          path: teaching-materials/readings/rendered/

      - name: Open a draft PR with the rendered PDFs
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="chore/render-readings-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add teaching-materials/readings/rendered/
          git commit -m "Render readings: ${{ inputs.reading }} (run ${{ github.run_number }})"
          git push origin "$BR"
          gh pr create --draft --base dev --head "$BR" \
            --title "Render readings: ${{ inputs.reading }}" \
            --body "Rendered by the Render readings workflow (run ${{ github.run_number }}) from ${{ github.ref_name }} at ${{ github.sha }}."
