# Conda environment for Module 4: Synthesizing Federal water data products.
# Create with:  conda env create -f environments/synthesis.yml
# Then:         conda activate fwdc-synthesis
name: fwdc-synthesis
channels:
  - conda-forge
dependencies:
  - python=3.12
  # USGS observations (modernized Water Data OGC APIs)
  - dataretrieval>=1.1
  # NASA SWOT: Earthdata search/download; hydrocron is a web API reached with requests
  - earthaccess
  - requests
  # Gridded / NetCDF data
  - xarray
  - netcdf4
  - h5netcdf
  - rioxarray
  - pyproj
  # NOAA NWM forecasts and NHD/NLDI reach lookups
  - pynhd>=0.19
  - fsspec
  - gcsfs
  # Tables, maps and plots
  - pandas
  - geopandas
  - matplotlib
  # hydrotools dependencies, installed from conda-forge so pip doesn't pull
  # binary wheels (e.g. pyarrow) that clash with conda-forge libraries on Windows
  - pyarrow
  - dask
  - pytables
  - pydantic
  - pint
  - scipy
  - adlfs
  - planetary-computer
  - pip
  - pip:
      - hydrotools.nwm_client_new
