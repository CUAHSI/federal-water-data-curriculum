# Environment for Module 3, "Retrieve USGS water data" (03-federal-water-data-access-retrieval/03_access_usgs_nwis.md)
# Create:   mamba env create -f environments/nwis.yml   (or: conda env create -f environments/nwis.yml)
# Activate: conda activate fwdc-nwis
name: fwdc-nwis
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - dataretrieval>=1.1   # modernized `waterdata` module (USGS Water Data APIs)
  - pandas
  - geopandas
  - matplotlib
